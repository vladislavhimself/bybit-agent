# Активный рынок по умолчанию: crypto (Bybit) или moex (Мосбиржа через T-Invest).
# Переключение на лету командой /market в Telegram: выбор хранится в data/market.txt и переживает перезапуск.
market: crypto
currency: USDT

# Все проценты указаны в процентах от торгового капитала (equity минус защищённый резерв прибыли)

quote: USDT

universe:
  top_n_by_turnover: 30          # сколько самых ликвидных крипто-пар сканировать
  min_turnover_24h_usd: 30000000 # ниже этого оборота за сутки пару не трогаем (защита от неликвида)
  min_listing_days: 45           # свежие листинги ведут себя непредсказуемо: не трогаем
  always: [BTCUSDT, ETHUSDT, SOLUSDT]
  blacklist: []

sources:
  # Публичные Telegram-каналы (читаются через t.me/s/<канал>, без логина). Самый быстрый бесплатный источник.
  # MuskTweets = зеркало твитов Маска, realdonaldtrump_truth и TrumpTruthPosts = зеркала Truth Social, whitehouse = Белый дом
  telegram_channels: [WatcherGuru, crypto_headlines, cointelegraph, CoinDeskGlobal, wublockchainenglish, BWEnews,
                      unfolded, binance_announcements, Bybit_Announcements,
                      MuskTweets, realdonaldtrump_truth, TrumpTruthPosts, whitehouse,
                      whale_alert_io, whalebotalerts,
                      glassnode, cryptoquant_official, ForkLog, incrypted]
  # Каналы, чьи сообщения о крупных переводах разбираются без модели (bot/whales.py)
  whale_channels: [whale_alert_io]
  whale_min_usd: 50000000
  # Truth Social напрямую (открытый API, без ключей): имя -> id аккаунта
  truthsocial_accounts: {realDonaldTrump: "107780257626128497"}
  # X (Twitter) через официальный API. Оплата по факту: ~0.005$ за пост. Нужен TWITTER_BEARER_TOKEN.
  # twitter_mode: stream = X Activity API (поток событий в реальном времени, лучший вариант),
  #               poll   = опрос search/recent раз в twitter_poll_sec (дороже и медленнее), off = выключено
  twitter_mode: "off"              # платно, пока выключено; stream = X Activity API, poll = опрос search/recent
  # Аккаунты по силе влияния на крипторынок (для режимов stream/poll):
  # политика и макро: elonmusk, realDonaldTrump, WhiteHouse, federalreserve, USTreasury, SecScottBessent, NickTimiraos
  # регуляторы: SECGov, CFTC
  # новостные ленты (самые быстрые): DeItaone, FirstSquawk, unusual_whales, WatcherGuru, tier10k, KobeissiLetter
  # крипто-лидеры: cz_binance, saylor, VitalikButerin, brian_armstrong, paoloardoino, justinsuntron
  # ончейн и взломы: lookonchain, whale_alert, PeckShieldAlert, zachxbt, ArkhamIntel
  twitter_accounts: [elonmusk, realDonaldTrump, WhiteHouse, federalreserve, USTreasury, SecScottBessent, NickTimiraos,
                     SECGov, CFTC, DeItaone, FirstSquawk, unusual_whales, WatcherGuru, tier10k, KobeissiLetter,
                     cz_binance, saylor, VitalikButerin, brian_armstrong, paoloardoino, justinsuntron,
                     lookonchain, whale_alert, PeckShieldAlert, zachxbt, ArkhamIntel]
  twitter_poll_sec: 120

news:
  full_text: true                # читать статью целиком по ссылке (кроме Telegram), а не только анонс из RSS

intervals:
  news_poll_sec: 5               # цикл новостей; внутри ярусы: быстрые Telegram-каналы 5 с, остальные 30 с, быстрые RSS 20 с
  tg_fast_sec: 5
  tg_slow_sec: 30
  rss_fast_sec: 20
  scan_sec: 300
  manage_sec: 30
  balance_report_hours: 4
  review_every_closed_trades: 8
  review_every_hours: 24

risk:
  max_leverage: 15               # жёсткий потолок, реальное плечо считается от стопа и обычно 1-4
  risk_per_trade_pct:            # сколько теряем, если сработает стоп
    low: 0.4
    medium: 0.8
    high: 1.5
    conviction: 3.0              # только при полном согласии всех сигналов + подтверждении модели
  # Лимит торгового капитала: бот считает своим только capital_cap_usd + прибыль/убыток с момента старта.
  # Прибыль автоматически увеличивает торговый капитал, резерв прибыли работает поверх. 0 = без лимита.
  capital_cap_usd: 300
  max_open_positions: 5
  max_same_direction: 2          # альты ходят вместе: не больше 2 позиций в одну сторону
  symbol_cooldown_hours: 12      # после входа по монете следующий вход в ту же сторону не раньше чем через 12 ч
  max_trades_per_event: 2        # не больше 2 сделок на одну и ту же новость
  max_direction_risk_pct: 2.5    # суммарный риск всех позиций в одну сторону (если все стопы сработают)
  max_total_exposure_x: 3.0      # суммарный объём позиций не больше 3x от торгового капитала
  daily_loss_limit_pct: 6
  weekly_loss_limit_pct: 12
  kill_switch_drawdown_pct: 25   # просадка от пика, при которой бот останавливается и ждёт /resume
  stop_atr_mult: 2.5           # на истории 2.5-3 ATR лучше 1.5-2
  tp_levels:                     # частичные тейки: доля позиции и уровень в R (R = расстояние до стопа)
    - {r: 0.8, part: 0.40}
    - {r: 2.0, part: 0.35}
  # остаток (25%) ведётся трейлингом; после первого тейка стоп переносится в безубыток
  breakeven_after_tp1: true
  breakeven_r: 0.7               # стоп в безубыток, как только прибыль достигла 0.7R (не дожидаясь тейка)
  giveback_r: 0.6                # если прибыль откатилась от пика больше чем на 0.6R, закрываем остаток
  giveback_min_peak_r: 0.8       # защита от отката включается только после пика 0.8R
  stall_hours: 12                # сделка в плюсе, но пик не обновлялся столько часов = закрываем
  trail_after_r: 1.0
  max_hours_in_trade: 48
  weekend_risk_mult: 1.0         # на истории выходные не хуже будней, размер не режем
  min_notional_usd: 6
  # Защита прибыли: каждый раз, когда торговый капитал вырос на profit_lock_step_pct от базы,
  # profit_lock_pct этого прироста уходит в резерв и больше никогда не участвует в торговле
  profit_lock_step_pct: 10
  profit_lock_pct: 50
  # Запрет новых входов вокруг макро-релизов высокой важности (CPI, FOMC, NFP)
  macro_blackout_min_before: 30
  macro_blackout_min_after: 15
  # Реакция на новости по открытым позициям
  news_exit_min_importance: 7    # контр-новость такой важности закрывает позицию
  news_flip: true                # и, если сигнал в другую сторону достаточно силён, открывает обратную

entry:
  mode: pullback                 # pullback = лимитный ордер на откате; market = сразу по рынку
  pullback_atr: 0.5              # насколько ниже (для лонга) текущей цены ставим лимит, в ATR(1ч); на истории глубже = лучше
  pullback_atr_news: 0.15        # для сигналов по новости откат мельче: такие движения часто идут без возврата
  already_pulled_atr: 0.15       # если цена и так не дальше этого от 15-минутной средней, входим сразу
  wait_minutes: 60               # сколько ждать отката, потом ордер снимается
  impulse_min_importance: 8      # исключение: очень важная и свежая новость = вход по рынку
  impulse_max_age_min: 15

shadow:
  enabled: true
  weak_margin: 0.10          # слабые сигналы записываем, если до порога не хватило меньше этого
  dedup_hours: 12            # одна теневая сделка на монету, сторону и причину за 12 ч
  first_check_hours: 3       # первая проверка через 3 ч, дальше каждые recheck_hours, пока сделка не закроется
  recheck_hours: 3
  horizon_hours: 72          # дольше не ждём: закрываем по последней цене
  resolve_per_cycle: 2       # сколько теневых сделок проверять за цикл (бережём лимит запросов биржи)
  min_for_review: 20         # разбор запускается и без реальных сделок, если набралось столько новых теневых
  min_n_verdict: 10          # с какого количества делать вывод «фильтр помогает / мешает»

psychology:
  runup_hours: 48            # окно, в котором смотрим ход цены ДО новости
  runup_pct: 8               # ход в сторону новости больше этого = новость во многом в цене
  reaction_min_minutes: 30   # через сколько минут после новости оценивать реакцию цены
  reaction_strong_pct: 1.0   # заметная реакция (умножается на 1 + важность/10)
  crowd_threshold: 0.5       # перекос толпы, с которого режем входы вместе с ней
  late_entry_hours: 2        # новость старше этого и уже отыграна на late_entry_pct = вход поздний, сила x0.4
  late_entry_pct: 2.0

signals:
  entry_threshold: 0.50
  conviction_threshold: 0.85
  news_weight: 1.0               # вклад новости (0..1) умножается на вес и складывается с остальными
  ta_weight: 0.6
  positioning_weight: 0.4
  min_news_importance: 5         # новости слабее этого в счёт не идут
  max_extension_atr: 2.0         # не входить, если за 24ч цена уже прошла столько ATR(1ч) в нашу сторону
  fresh_news_minutes: 20         # кроме свежей (моложе стольких минут) новости важностью 7+
  use_playbook: true             # корректировать вклад новости историческим откликом на такой тип событий

llm:
  model: claude-opus-5-5         # основной аналитик
  cheap_model: claude-haiku-5-5  # предварительный фильтр новостей (дёшево)
  review_model: claude-opus-5-5  # разбор сделок и самообучение
  daily_budget_usd: 4            # при превышении до конца суток всё переводится на дешёвую модель
  workers: 4                     # параллельных разборов новостей: в час пик очередь к модели доходила до 20 минут
  prefilter_batch: 8             # дешёвый фильтр смотрит до 8 заголовков за один вызов (расход на фильтр ÷5)
  cheap_slow_channels: true      # Telegram-каналы вне быстрого яруса разбирает дешёвая модель
  # Второстепенные источники (пересказы, обзоры): новости из них разбирает дешёвая модель
  cheap_sources: [ambcrypto, utoday, newsbtc, beincrypto, cryptonews, cryptoslate, coinjournal, thedefiant,
                  tg:crypto_headlines, tg:incrypted, tg:ForkLog, tg:MuskTweets, tg:whalebotalerts]

learning:
  enabled: true
  param_changes: false           # модель даёт только текстовые уроки; параметры меняет лишь еженедельный перерасчёт на истории
  walkforward:                   # еженедельный перерасчёт параметров на истории с проверкой вне выборки (bot/walkforward.py)
    enabled: true
    weekday: 6                   # воскресенье
    hour_utc: 9                  # 12:00 МСК
    is_days: 730                 # обучающее окно
    oos_days: 90                 # проверка на последних 3 месяцах, которых подбор не видел
    min_is_trades: 150
    oos_tolerance_r: 0.03        # новый набор вне выборки не хуже текущего более чем на столько R
  auto_apply: true               # на demo/testnet правки параметров применяются сами; на live только после /approve


# ===================== Мосбиржа: накладывается на общие настройки, когда активен рынок moex =====================
markets:
  moex:
    shadow:
      paper_mode: false                 # выключен по решению пользователя 30.10: бот учится на сделках, а не стоит
      paper_mode_days: 3
      paper_mode_min_n: 12              # судим по теням, которые бот взял бы, и реальным сделкам (не по теням ворот)
      paper_mode_below_r: -0.02
    currency: RUB
    universe:
      top_n_by_turnover: 20             # 20 ликвидных бумаг разных секторов: в 12 почти всё было сырьё (было 12)
      min_turnover_24h_usd: 500000000   # здесь это рубли: оборот акции за день от 500 млн; фьючерсам достаточно 30% от этого
      always: [SBERF, GAZPF, IMOEXF]    # вечные фьючерсы: без экспирации, торгуются вечером и в выходные
      blacklist: []
    moex:
      sandbox_start_rub: 100000         # пополнение песочницы при первом запуске
      prefer: futures                   # на один базовый актив один инструмент: вечный фьючерс > квартальный > акция
      min_days_to_expiry: 20            # квартальные контракты ближе к экспирации не берём
      futures_turnover_mult: 0.3
      big_trade_rub_share: 2000000      # «кит»: сделка от 2 млн руб по акции, от 3 млн по фьючерсу
      big_trade_rub_future: 1000000
      allowed_future_bases: [IMOEX, RTS]   # индексные фьючерсы; остальные фьючерсы только на акции
      trading_hours: [["07:05", "23:30"]]   # московское время; аукцион открытия и последние минуты не трогаем
      cbr_consensus: 14.0               # 23.10.2026: консенсус — сохранение 14% (вероятность ~90% по опросам). Обновлять перед каждым заседанием!
      event_symbols: [IMOEXF, SBERF]    # чем торгуем расхождение решения ЦБ с консенсусом
      cbr_current_rate: 14.0            # текущая ставка до заседания (для правила «ожидаемое снижение продают»)
      cbr_sell_expected_cut: true       # ожидаемое снижение: малый шорт (история 2022-2026: в 75% случаев ниже через сутки)
    sources:
      exchange_announcements: false
      twitter_mode: "off"
      whale_channels: []
      truthsocial_accounts: {realDonaldTrump: "107780257626128497"}
      telegram_channels: [markettwits, cbrstocks, if_market_news, AK47pfl, bcs_express, tb_invest_official,
                          russianmacro, divonline, investingcorp, rbc_news, selfinvestor, prime1, interfaxonline,
                          tass_agency, kommersant, vedomosti, banksta, centralbank_russia, minfin, smartlabnews,
                          alfa_investments, sberinvestments, headlines_for_traders, profitgate, MarketOverview,
                          bitkogan, truecon, realdonaldtrump_truth, TrumpTruthPosts, whitehouse]
      # быстрый ярус (каждые 5 с, напрямую из Германии): ленты, где важное появляется первым
      telegram_fast: [markettwits, cbrstocks, interfaxonline, rbc_news, headlines_for_traders, banksta, tass_agency]
      # быстрые RSS (каждые 20 с через Москву): новостные ленты агентств
      rss_fast: [interfax, rbc, tass, prime]
      rss:
        interfax: "https://www.interfax.ru/rss.asp"
        rbc: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss"
        kommersant: "https://www.kommersant.ru/RSS/news.xml"
        tass: "https://tass.ru/rss/v2.xml"
        vedomosti: "https://www.vedomosti.ru/rss/news"
        prime: "https://1prime.ru/export/rss2/index.xml"
        finmarket: "https://www.finmarket.ru/rss/mainnews.asp"
        smartlab: "https://smart-lab.ru/rss/"
        cbr: "https://www.cbr.ru/rss/RssPress"
        moex: "https://www.moex.com/export/news.aspx"
        forbes: "https://www.forbes.ru/newrss.xml"
        lenta_econ: "https://lenta.ru/rss/news/economics"
        frankmedia: "https://frankmedia.ru/feed"
        # корпоративные и отраслевые ленты: отчёты, дивиденды, сделки, санкции
        finam: "https://www.finam.ru/analysis/conews/rsspoint/"
        interfax_econ: "https://www.interfax.ru/rss.asp?sec=economy"
        interfax_biz: "https://www.interfax.ru/rss.asp?sec=business"
        kommersant_econ: "https://www.kommersant.ru/RSS/section-economics.xml"
        kommersant_fin: "https://www.kommersant.ru/RSS/section-finance.xml"
        vedomosti_fin: "https://www.vedomosti.ru/rss/rubric/finance"
        vedomosti_biz: "https://www.vedomosti.ru/rss/rubric/business"
        tass_econ: "https://tass.ru/rss/v2.xml?sections=MjU%3D"
        cbr_events: "https://www.cbr.ru/rss/eventrss"
        gazeta_biz: "https://www.gazeta.ru/export/rss/business.xml"
        ria: "https://ria.ru/export/rss2/archive/index.xml"
        izvestia: "https://iz.ru/xml/rss/all.xml"
    risk:
      capital_cap_usd: 100000           # рублей: торговый капитал бота в песочнице (ГО одного фьючерса на Сбер около 5 500)
      max_single_lot_risk_pct: 1.5      # если расчётный объём меньше лота, берём 1 лот, когда его риск не больше 1.5% капитала
      min_notional_usd: 500
      max_leverage: 6
      max_margin_share: 0.6             # гарантийное обеспечение всех контрактов не больше 60% капитала
      weekend_risk_mult: 0.5            # торги в выходные тонкие
      soft_stops: true                  # программный стоп в дополнение к стоп-заявке брокера
      # Геометрия выходов по исследованию research/moex_exits.py (19 бумаг, 500 дней, 218 техн. входов):
      # стоп 2.0 ATR лучше 2.5; тейки дальше и меньше; защита прибыли 0.6R после 0.8R срезала плюсы (PF 1.08 -> 1.35)
      stop_atr_mult: 2.0
      tp_levels:
        - {r: 1.5, part: 0.25}
        - {r: 2.5, part: 0.35}
      breakeven_r: 0.7
      giveback_r: 1.2
      giveback_min_peak_r: 1.5
      driver_check: {mode: shadow, min_peak_r: 2.0, every_min: 30}   # модель оценивает, жив ли драйвер движения; shadow = только записывать вердикты
      giveback_tiers: [[1.5, 1.5], [3.0, 1.0], [5.0, 0.6]]   # research/moex_trail.py: поводок короче с ростом прибыли, +12% к итогу за 7 лет
      max_hours_in_trade: 96
      div_block_days: 2                 # за 2 дня до последнего дня покупки под дивиденд входы по акции запрещены (гэп)
      symbol_cooldown_hours: 3          # 7 лет: пауза 3 ч вместо 12 даёт +5% сделок и PF 1.34 против 1.30
      news_exit_cooldown_hours: 12      # после закрытия по контр-новости в ту же сторону по компании не входим 12 ч
      max_entries_per_day: 2            # не больше двух входов в сутки по одной компании в одну сторону (31.10: три Газпрома за день)
      news_exit_max_names: 4            # новость с 5+ тикерами считается общерыночной: позицию не закрывает, при imp 8+ подтягивает стоп
      max_per_base: 1                   # одна компания — одна позиция (акция или фьючерс)
      max_per_sector: 2                 # не больше двух позиций в одном секторе: 27.10 было пять лонгов нефтегаза на одной новости
      sectors:
        oil_gas: [GAZP, LKOH, ROSN, NVTK, TATN, SNGS, SNGSP, TATNP, TRNFP, BANE, SIBN, RNFT]
        banks: [SBER, SBERP, VTBR, T, MOEX, SVCB, BSPB, CBOM, SFIN]
        metals: [GMKN, PLZL, CHMF, NLMK, MAGN, ALRS, RUAL, MTLR, SELG, UGLD, ENPG]
        index: [IMOEX, RTS]
        retail_tech: [YDEX, OZON, X5, MGNT, POSI, VKCO, HEAD, LENT, ASTR, DIAS, SOFL]
        transport: [AFLT, NMTP, FLOT, FESH]
        telecom_energy: [MTSS, RTKM, IRAO, HYDR, FEES, UPRO, MSNG, PHOR, AKRN]
      news_min_hold_hours: 24           # архив новостей: плюс у бычьих новостей по бумаге набирается к суткам (+0.33%), не к 4 ч (+0.14%)
    signals:
      use_playbook: false               # статистика по BTC к акциям не относится
      trend_gate: true                  # лонги только при растущем индексе и дневном тренде вверх; в падении только шорты
      trend_index: [IMOEXF, MOEX]       # по чему считаем режим рынка (индекс выше/ниже 20-дневной средней)
      # Архив новостей 2024-2026 (research/news_backtest.py, 25 791 событие): общерыночные и медвежьи новости
      # направление не предсказывают (48-50%); плюс только у бычьих новостей по бумаге важностью 7+.
      news_mode: stock_long_only        # новостной счёт только из бычьих новостей по конкретной бумаге; шорты — по технике
      drop_already_priced: false        # «уже в цене» от модели не выбрасываем: по архиву такие события шли не хуже
      news_entry_min_importance: 7      # новостной вход только на сильной новости (расхождение с ожиданиями всегда >=7)...
      news_entry_max_age_min: 15        # ...и свежей; остальное уходит в тени для статистики
      ta_long_mult: 0.85                # 7 лет истории: технические лонги PF 0.83, шорты 1.16 — лонг без новости режем
      tier_by_agreement: true           # большой размер только при согласии техники и тренда 4ч (high по новостям был −0.48R)
      max_extension_atr: 3.0            # 7 лет: 2 ATR -> 1192 сделки PF 1.30, 3 ATR -> 2158 сделок PF 1.31 (research/moex_more_trades.py)
      max_extension_atr_short: 99       # шорты без фильтра растяжения: 4708 сделок PF 1.30, плюс каждый год (research/moex_sizing.py)
      range_shorts: true                # 7 лет: шорты во флэте PF 1.21 (2024–2026 PF 1.4–2.2), лонги во флэте PF 0.9
      breadth_size: true                # ширина рынка как размер: ≥50% бумаг в тренде за — ступень больше, против — меньше (research/moex_regime.py)
      breadth_threshold: 0.5
      factor_weight: 0                  # макрофакторы пока только записываются в компоненты (проверка на тенях), в силу не входят
      factor_map:                       # сектор -> {фактор: вес}; + значит сектору хорошо, когда фактор растёт
