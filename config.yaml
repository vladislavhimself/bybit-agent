        - {date: "2026-12-18", time: "13:30", tz: "Europe/Moscow", title: "ЦБ РФ: решение по ключевой ставке", impact: high}
        - {date: "2026-10-21", time: "19:00", tz: "Europe/Moscow", title: "Росстат: недельная инфляция", impact: medium}
        - {date: "2026-10-28", time: "19:00", tz: "Europe/Moscow", title: "Росстат: недельная инфляция", impact: medium}
        - {date: "2026-11-05", time: "19:00", tz: "Europe/Moscow", title: "Росстат: недельная инфляция", impact: medium}
        - {date: "2026-11-11", time: "19:00", tz: "Europe/Moscow", title: "Росстат: недельная инфляция", impact: medium}
    llm:
      daily_budget_usd: 6.0             # прежний мягкий порог (оставлен для совместимости)
      pacing: true                      # лимит растянут на торговый день, чтобы сильная модель работала и вечером
      rule_filter_sources: ["*"]        # 07.11: новости без единого рыночного слова (bot/rulekeys.py) к модели не идут; "*" — все источники,
                                        # кроме раскрытий компаний. Выключить: []
      budget_soft_usd: 4.5              # до 4.5$ обычный режим; 4.5–6$ экономный (сильная модель только быстрые каналы и раскрытие)
      budget_hard_usd: 6.0              # после 6$ минимальный: всё дешёвой моделью, короткие тексты, разбор не останавливается
      monthly_budget_usd: 180           # лимит владельца; предупреждение и экономный режим с 80%
      extra_spend_usd: {"2026-10-24 разметка архива новостей": 27.0}   # расходы с ключа вне бота, показываются в балансе
      article_max_chars: 2500           # полный текст статьи в разборе обрезается (раньше до 4000 и контекст без кеша)
      article_max_chars_economy: 1200
      cheap_sources: [lenta_econ, forbes, smartlab, gazeta_biz, ria, izvestia, tass_econ, "tg:profitgate", "tg:MarketOverview", "tg:investingcorp",
                      "tg:divonline", "tg:selfinvestor", "tg:bitkogan", "tg:truecon", "tg:headlines_for_traders"]
      # как модель иногда называет бумагу -> тикер на бирже. 06.11: «CIAN» вместо CNRU, новость к Циану не привязалась
      ticker_alias: {CIAN: CNRU, ЦИАН: CNRU, TCSG: T, TCS: T, TINKOFF: T, YNDX: YDEX, YANDEX: YDEX, FIVE: X5, X5RG: X5,
                     HHRU: HEAD, HH: HEAD, VK: VKCO, VKCOM: VKCO, MTS: MTSS, LSR: LSRG, RUSAL: RUAL, POLY: PLZL, POLYUS: PLZL,
                     SBERBANK: SBER, GAZPROM: GAZP, LUKOIL: LKOH, ROSNEFT: ROSN, NOVATEK: NVTK, NORNICKEL: GMKN, MAGNIT: MGNT,
                     AEROFLOT: AFLT, SAMOLET: SMLT, SOVCOMBANK: SVCB, ALROSA: ALRS, SEVERSTAL: CHMF, TATNEFT: TATN, MECHEL: MTLR,
                     SISTEMA: AFKS, ROSTELECOM: RTKM, INTERRAO: IRAO, PHOSAGRO: PHOR, MVIDEO: MVID, SEGEZHA: SGZH, POSITIVE: POSI,
                     ASTRA: ASTR, WHOOSH: WUSH, FIXP: FIXR, VTB: VTBR, PIK: PIKK, NLMK: NLMK, MMK: MAGN, SELIGDAR: SELG}
      market_notes: |
        Рынок: Московская биржа, акции и фьючерсы в рублях, торговля на часы. В affected_symbols указывай тикеры
        Мосбиржи (SBER, GAZP, LKOH, ROSN, NVTK, GMKN, YDEX, TATN, VTBR, MGNT, PLZL, CHMF, NLMK, MTSS, ALRS, MOEX,
        OZON, T, AFLT, SNGS, X5, RUAL, PIKK, SMLT, NMTP, FLOT, IRAO, FEES, HYDR, UPRO, PHOR). Новость про индекс
        или весь рынок: market_wide = true. Что двигает рынок: ключевая ставка и риторика ЦБ (macro), недельная
        инфляция (macro), санкции и переговоры (regulation), курс рубля и нефть (macro), дивиденды и отсечки
        (earnings: рекомендация выше ожиданий = bullish, отказ от дивидендов = bearish), отчёты (earnings),
        байбэки и сделки инсайдеров (whale), допэмиссии и SPO (bearish, collapse), ESG и прочее = other.
        Розничные инвесторы доминируют: на громкой новости движение с перебором, затем откат.
        Источник disclosure = сообщение эмитента с сервера раскрытия (первоисточник, не пересказ): дивиденды,
        решения совета директоров, допэмиссии, сделки — считай importance выше, чем у пересказа в СМИ.
